# Version updates target dev, like every other change; they reach main with
# the next dev -> main PR. The "dependencies" label exempts them from the
# Changelog check (changelog.yml also exempts Dependabot by author, in case a
# label is ever missing: Dependabot silently skips labels that don't exist).
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dhaka"
    target-branch: "dev"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      gopsutil:
        patterns:
          - "github.com/shirou/gopsutil/*"
          - "github.com/ebitengine/purego"
          - "github.com/lufia/plan9stats"
          - "github.com/power-devops/perfstat"
          - "github.com/tklauser/*"
          - "github.com/yusufpapurcu/wmi"
      supabase:
        patterns:
          - "github.com/supabase-community/*"
      sqlite:
        patterns:
          - "modernc.org/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dhaka"
    target-branch: "dev"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    # GitHub doesn't support mixing CodeQL Action versions in one workflow,
    # so its sub-actions are always bumped together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
