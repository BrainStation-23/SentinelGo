# Version updates target dev, like every other change; they reach main with
# the next dev -> main PR. The "dependencies" label exempts them from the
# Changelog check (changelog.yml also exempts Dependabot by author, in case a
# label is ever missing: Dependabot silently skips labels that don't exist).
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dhaka"
    target-branch: "dev"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Few PRs a week: both rulesets require branches to be up to date, so
    # separate PRs would each rerun full CI every time another one merged.
    # A dependency joins the first group that matches it. gopsutil and sqlite
    # stay together with their companion modules for every update, majors
    # included, because they must move in step. Everything else gets one
    # PR for minor and patch bumps; other major versions stay separate PRs,
    # since they can break the build.
    groups:
      gopsutil:
        patterns:
          - "github.com/shirou/gopsutil/*"
          - "github.com/ebitengine/purego"
          - "github.com/lufia/plan9stats"
          - "github.com/power-devops/perfstat"
          - "github.com/tklauser/*"
          - "github.com/yusufpapurcu/wmi"
      sqlite:
        patterns:
          - "modernc.org/*"
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dhaka"
    target-branch: "dev"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    # GitHub doesn't support mixing CodeQL Action versions in one workflow,
    # so its sub-actions are always bumped together, majors included. Every
    # other action gets one PR for minor and patch bumps.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
