name: Fuzz

# Runs Go native fuzzing (func FuzzXxx(*testing.F)) on a schedule. Pull requests
# don't need this: the seed corpora already run as plain tests in ci.yml.
#
# A `list` job discovers every target (statically, for all OSes) via
# scripts/fuzz, then one matrix job per target fuzzes it on the matching runner.
# A failing target uploads its crasher from testdata/fuzz/ and prints the repro
# command in the job summary. Commit the crasher together with the fix.

on:
  schedule:
    - cron: '0 1 * * *' # nightly 01:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Time to fuzz each target (go test -fuzztime)'
        required: false
        default: '5m'

permissions:
  contents: read

env:
  GO_VERSION: '1.26.0'
  CGO_ENABLED: '0'

jobs:
  list:
    name: List fuzz targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Discover targets
        id: list
        run: echo "matrix=$(go run ./scripts/fuzz -matrix)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }} (${{ matrix.os }})
    needs: list
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.matrix) }}
    env:
      FUZZ_PKG: ${{ matrix.pkg }}
      FUZZ_DIR: ${{ matrix.dir }}
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_OS: ${{ matrix.os }}
      FUZZTIME: ${{ inputs.fuzztime || '5m' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Locate fuzz cache
        id: gocache
        shell: bash
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      # The generated corpus lives in GOCACHE/fuzz; carrying it across nightly
      # runs lets each run build on what earlier runs discovered.
      - name: Restore generated corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: fuzz-${{ matrix.os }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.os }}-${{ matrix.target }}-

      - name: Fuzz
        shell: bash
        run: go test -run='^$' -fuzz="^${FUZZ_TARGET}\$" -fuzztime="${FUZZTIME}" "${FUZZ_PKG}"

      - name: Upload crasher
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ matrix.os }}
          path: ${{ matrix.dir }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: warn

      - name: Repro instructions
        if: failure()
        shell: bash
        run: |
          {
            echo "### ${FUZZ_TARGET} found a failing input"
            echo
            echo "1. Download the \`fuzz-crash-${FUZZ_TARGET}-${FUZZ_OS}\` artifact into \`${FUZZ_DIR}/testdata/fuzz/${FUZZ_TARGET}/\`."
            echo "2. Reproduce: \`go test -run='^${FUZZ_TARGET}\$/<file name>' ${FUZZ_PKG}\`"
            echo "3. Fix the bug and commit the input file as a regression seed."
          } >> "$GITHUB_STEP_SUMMARY"
