name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; jobs that need more request it explicitly.
permissions:
  contents: read

# Go comes from go.mod's toolchain line (setup-go's go-version-file reads it),
# the single place the version is set. Builds, tests and govulncheck can't
# drift apart: govulncheck once ran a newer Go than releases were built with
# and missed 28 standard-library vulnerabilities (#183).

jobs:
  # ── 1. Require CI to have passed on the tagged commit ─────────────────────
  # The tag is always a commit on main, which only accepts pull requests that
  # passed the required checks, and the push to main runs CI on that exact
  # commit. Tag Release pushes the tag from that same push, so CI is usually
  # still running: wait for its "CI passed" job instead of running the whole
  # pipeline a third time. A tag on a commit without a green "CI passed"
  # (e.g. a tag pushed by hand to an untested commit) publishes nothing.
  verify-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: read  # the "CI passed" check runs
      actions: read # the CI workflow runs for the commit
    steps:
      # Passes as soon as any "CI passed" check on the commit succeeded. A
      # failed check alone doesn't end the wait: it fails only when no CI run
      # for the commit is queued or running and none has succeeded, for 5
      # minutes in a row. A re-run of failed CI jobs puts its run back in
      # progress, and the grace period covers the moment between starting a
      # re-run and GitHub registering it.
      - name: Wait for "CI passed" on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checks="repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20passed"
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA"
          idle=0
          for _ in $(seq 1 110); do
            if gh api "$checks" --jq '[.check_runs[].conclusion]' | jq -e 'any(. == "success")' > /dev/null; then
              echo "CI passed on $GITHUB_SHA."
              exit 0
            fi
            active=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            total=$(gh api "$runs" --jq '.total_count')
            echo "$(date -u +%T) CI runs for $GITHUB_SHA: $total, still queued or running: $active"
            if [ "$total" -gt 0 ] && [ "$active" -eq 0 ]; then
              idle=$((idle + 1))
              if [ "$idle" -ge 10 ]; then
                echo "::error::CI finished on $GITHUB_SHA without passing. If the failure was flaky, re-run the failed CI jobs on main, then re-run this workflow; otherwise fix main and release a new version."
                exit 1
              fi
            else
              idle=0
            fi
            sleep 30
          done
          echo "::error::No successful \"CI passed\" check on $GITHUB_SHA after 55 minutes. Is this tag on a commit pushed to main?"
          exit 1

  # ── 2. Build release artifacts ─────────────────────────────────────────────
  # One job, one runner. `make all` cross-compiles all 5 targets sequentially,
  # in both builds (full and read-only, #548)
  # using the version tag injected via VERSION=. Uploads a single artifact
  # bundle so the release job can attach everything to the GitHub Release.
  build:
    name: Build all platforms
    runs-on: ubuntu-latest
    needs: verify-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # Fail before building if the tag has no CHANGELOG.md section to publish.
      - name: Check release notes exist
        run: go run ./scripts/changelog -extract "${GITHUB_REF#refs/tags/}" > /dev/null

      - name: Ensure shell scripts are executable
        run: chmod +x installation-doc/install.sh installation-doc/install.command scripts/*.sh

      - name: Build all platforms
        run: make all VERSION="${GITHUB_REF#refs/tags/}"

      # Scan the binaries that will ship, not the source: each records the Go
      # that built it, so no CI setup mistake can hide a vulnerable toolchain
      # or dependency. Any reachable vulnerability stops the release before
      # anything is signed. Only counts are logged: this log is public and the
      # previous release likely has the same findings (coordinated disclosure,
      # see SECURITY.md); run the command below locally for details. Pinned;
      # bump by hand (Dependabot can't see it).
      - name: Scan release binaries with govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          failed=0
          for bin in build/windows/sentinelgo-windows-amd64.exe build/linux/sentinelgo-linux-amd64 build/linux/sentinelgo-linux-arm64 \
                     build/darwin/sentinelgo-darwin-amd64 build/darwin/sentinelgo-darwin-arm64 \
                     build/windows/sentinelgo-readonly-windows-amd64.exe build/linux/sentinelgo-readonly-linux-amd64 build/linux/sentinelgo-readonly-linux-arm64 \
                     build/darwin/sentinelgo-readonly-darwin-amd64 build/darwin/sentinelgo-readonly-darwin-arm64; do
            label="$bin ($(go version "$bin" | awk '{print $NF}'))"
            if govulncheck -mode=binary "$bin" > report.txt 2>&1; then
              echo "$label: no vulnerabilities found"
            else
              failed=1
              echo "::error::$label: $(grep -c '^Vulnerability #' report.txt || true) reachable vulnerabilities. Details withheld from this public log; build the release locally and run: govulncheck -mode=binary <binary>"
            fi
          done
          rm -f report.txt
          exit "$failed"

      # The installers run as root/Administrator, so they are signed, checksummed
      # and attested exactly like the binaries, and the release publishes these
      # signed copies (not the files straight from the checkout).
      - name: Collect binaries and installers into dist/
        run: |
          mkdir -p dist
          cp build/windows/sentinelgo-windows-amd64.exe dist/
          cp build/linux/sentinelgo-linux-amd64          dist/
          cp build/linux/sentinelgo-linux-arm64           dist/
          cp build/darwin/sentinelgo-darwin-amd64         dist/
          cp build/darwin/sentinelgo-darwin-arm64         dist/
          cp build/windows/sentinelgo-readonly-windows-amd64.exe dist/
          cp build/linux/sentinelgo-readonly-linux-amd64          dist/
          cp build/linux/sentinelgo-readonly-linux-arm64          dist/
          cp build/darwin/sentinelgo-readonly-darwin-amd64        dist/
          cp build/darwin/sentinelgo-readonly-darwin-arm64        dist/
          cp installation-doc/install.sh \
             installation-doc/install.command \
             installation-doc/install.bat \
             installation-doc/sentinelgo-install.desktop dist/

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: dist/

      # macOS code signing (#352) needs codesign, so the sign job runs on
      # macOS when the MACOS_CODESIGN_P12 secret holds a signing certificate,
      # and on Linux otherwise. Without the secret the macOS binaries ship
      # unsigned, as before, and the installers sign them ad-hoc on the Mac.
      # Only emptiness is tested here; the secret's value isn't used.
      - name: Choose the sign job's runner
        id: signer
        env:
          MACOS_CODESIGN_P12: ${{ secrets.MACOS_CODESIGN_P12 }}
        run: |
          if [ -n "$MACOS_CODESIGN_P12" ]; then
            echo "runner=macos-latest" >> "$GITHUB_OUTPUT"
            echo "::notice::MACOS_CODESIGN_P12 is set: the macOS binaries will be code-signed."
          else
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CODESIGN_P12 is not set: the macOS binaries ship without a code signature (signed ad-hoc at install)."
          fi
    outputs:
      signer: ${{ steps.signer.outputs.runner }}

  # ── 2a. Code-sign (macOS), Ed25519-sign, checksum ─────────────────────────
  # Code signing changes the macOS binaries' bytes, so it runs before the
  # Ed25519 signatures, SHA256SUMS and SBOMs, which then cover the signed
  # binaries that ship.
  sign:
    name: Sign binaries and installers
    runs-on: ${{ needs.build.outputs.signer }}
    needs: build
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download unsigned artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unsigned
          path: dist

      - name: Code-sign the macOS binaries
        if: runner.os == 'macOS'
        env:
          MACOS_CODESIGN_P12: ${{ secrets.MACOS_CODESIGN_P12 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
        run: bash scripts/macos-codesign.sh dist/sentinelgo-darwin-amd64 dist/sentinelgo-darwin-arm64 dist/sentinelgo-readonly-darwin-amd64 dist/sentinelgo-readonly-darwin-arm64

      # Notarization (#491) needs a Developer ID signature. It doesn't change
      # the binaries, so the Ed25519 signatures below still cover them. The
      # script skips with a notice for an internal CA signature, warns without
      # the key or when Apple doesn't answer in time, and fails the release
      # only when Apple rejects the binaries.
      - name: Notarize the macOS binaries
        if: runner.os == 'macOS'
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/macos-notarize.sh dist/sentinelgo-darwin-amd64 dist/sentinelgo-darwin-arm64 dist/sentinelgo-readonly-darwin-amd64 dist/sentinelgo-readonly-darwin-arm64

      - name: Sign binaries and installers, generate SHA256SUMS
        env:
          SENTINELGO_SIGNING_KEY: ${{ secrets.SENTINELGO_SIGNING_KEY }}
        run: |
          go run ./scripts/sign \
            dist/sentinelgo-linux-amd64 \
            dist/sentinelgo-linux-arm64 \
            dist/sentinelgo-darwin-amd64 \
            dist/sentinelgo-darwin-arm64 \
            dist/sentinelgo-windows-amd64.exe \
            dist/sentinelgo-readonly-linux-amd64 \
            dist/sentinelgo-readonly-linux-arm64 \
            dist/sentinelgo-readonly-darwin-amd64 \
            dist/sentinelgo-readonly-darwin-arm64 \
            dist/sentinelgo-readonly-windows-amd64.exe \
            dist/install.sh \
            dist/install.command \
            dist/install.bat \
            dist/sentinelgo-install.desktop

      # Shipped next to the binaries: BSD/MIT/Apache require their notices to
      # travel with binary redistributions. One CycloneDX SBOM per binary.
      - name: Generate third-party notices and SBOMs
        run: go run ./scripts/licenses -notices dist/THIRD_PARTY_NOTICES.txt -sbom dist

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: dist/

  # ── 2a'. Generic macOS package (#352) ─────────────────────────────────────
  # sentinelgo-darwin-universal.pkg, which MDM installs on every Mac
  # (InstallEnterpriseApplication, Compliance-OS#555): a universal binary
  # made with lipo from the two darwin binaries the sign job code-signed, no
  # config.json (the agent enrolls from MDM managed preferences), and a
  # postinstall that runs `sentinelgo -install`. See scripts/macos-pkg.sh.
  # It is signed with productsign only when MACOS_INSTALLER_P12 holds a
  # Developer ID Installer identity (#491), and notarized and stapled when the
  # notary key is set too. An unsigned package is still published, for manual
  # installs, but left out of sentinelgo-installers.json, since MDM can't
  # install it. This job can't fail the release: the MSI job runs either way
  # and adds the packages only when `built` is true.
  # The read-only build's package, sentinelgo-readonly-darwin-universal.pkg
  # (#550), is built the same way from the read-only binaries, for
  # third-party MDM (Compliance-OS#1082). Both are notarized, hence the time.
  pkg:
    name: Build the macOS packages
    runs-on: macos-latest
    needs: sign
    continue-on-error: true
    timeout-minutes: 75
    outputs:
      built: ${{ steps.done.outputs.built }}
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist

      # Both packages use the same signing keys, so they are signed or
      # unsigned together, and `signed` (the last write wins) holds for both.
      - name: Build the packages
        id: build
        env:
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          mkdir -p pkg
          bash scripts/macos-pkg.sh "$GITHUB_REF_NAME" \
            dist/sentinelgo-darwin-amd64 dist/sentinelgo-darwin-arm64 \
            pkg/sentinelgo-darwin-universal.pkg
          bash scripts/macos-pkg.sh "$GITHUB_REF_NAME" \
            dist/sentinelgo-readonly-darwin-amd64 dist/sentinelgo-readonly-darwin-arm64 \
            pkg/sentinelgo-readonly-darwin-universal.pkg

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pkg
          path: pkg/

      - name: Mark the packages built
        id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  # ── 2b. Generic Windows MSI (#358) ────────────────────────────────────────
  # One MSI for every device, which an MDM pushes with the device's
  # enrollment token (see installer/msi/sentinelgo.wxs), and the read-only
  # build's (#550), for third-party deployment (Compliance-OS#1082). Built
  # from the exes in the artifact, so they hold exactly the bytes whose .sig
  # was published. build.ps1 checks each built package (the exe's build,
  # ProductCode, hidden token properties, enrollment before the service
  # starts). The MSIs and the installers metadata the backend mirror reads
  # (sentinelgo-installers.json, with each package's ProductCode or
  # identifier and SHA-256, per flavor) are signed like every other asset and
  # added to SHA256SUMS; the artifact is then replaced with the complete set.
  # Not Authenticode-signed yet: that needs a code-signing certificate (#358).
  # WiX is pinned; bump it together with ci.yml's.
  msi:
    name: Build the Windows MSI
    runs-on: windows-latest
    needs: [sign, pkg]
    # Runs when the macOS package job failed too: the package is optional.
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist

      - name: Install WiX
        shell: bash
        run: |
          dotnet tool install wix --version 4.0.6 --tool-path "$RUNNER_TEMP/wix"
          "$RUNNER_TEMP/wix/wix" extension add --global WixToolset.Util.wixext/4.0.6

      - name: Build and check the MSIs
        shell: pwsh
        run: |
          ./installer/msi/build.ps1 -Tag "$env:GITHUB_REF_NAME" -AgentExe dist/sentinelgo-windows-amd64.exe -Out dist/sentinelgo-windows-amd64.msi -Wix "$env:RUNNER_TEMP/wix/wix.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./installer/msi/build.ps1 -Tag "$env:GITHUB_REF_NAME" -Flavor readonly -AgentExe dist/sentinelgo-readonly-windows-amd64.exe -Out dist/sentinelgo-readonly-windows-amd64.msi -Wix "$env:RUNNER_TEMP/wix/wix.exe"

      - name: Download the macOS packages
        if: needs.pkg.outputs.built == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pkg
          path: dist

      # A package goes into the metadata only when it is signed (MDM
      # installs nothing else); an unsigned one is still published.
      - name: Write sentinelgo-installers.json
        shell: bash
        env:
          PKG_SIGNED: ${{ needs.pkg.outputs.signed }}
        run: |
          args=(-msi dist/sentinelgo-windows-amd64.msi -msi dist/sentinelgo-readonly-windows-amd64.msi)
          if [ "$PKG_SIGNED" = "true" ]; then
            for p in dist/sentinelgo-darwin-universal.pkg dist/sentinelgo-readonly-darwin-universal.pkg; do
              if [ -f "$p" ]; then args+=(-pkg "$p"); fi
            done
          fi
          go run ./scripts/msi -version "$GITHUB_REF_NAME" -manifest dist/sentinelgo-installers.json "${args[@]}"
          cat dist/sentinelgo-installers.json

      # scripts/sign writes a SHA256SUMS for the files it is given: keep the
      # build job's list and append the new lines.
      - name: Sign the MSIs, the macOS packages and the metadata, add them to SHA256SUMS
        shell: bash
        env:
          SENTINELGO_SIGNING_KEY: ${{ secrets.SENTINELGO_SIGNING_KEY }}
        run: |
          mv dist/SHA256SUMS SHA256SUMS.build
          files=(dist/sentinelgo-windows-amd64.msi dist/sentinelgo-readonly-windows-amd64.msi dist/sentinelgo-installers.json)
          for p in dist/sentinelgo-darwin-universal.pkg dist/sentinelgo-readonly-darwin-universal.pkg; do
            if [ -f "$p" ]; then files+=("$p"); fi
          done
          go run ./scripts/sign "${files[@]}"
          cat SHA256SUMS.build dist/SHA256SUMS > SHA256SUMS.all
          mv SHA256SUMS.all dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: dist/
          overwrite: true

  # ── 3. Attest binaries ─────────────────────────────────────────────────────
  # Sigstore-signed attestations stored in GitHub's attestations API, binding
  # each binary's digest to (a) SLSA build provenance — built by this workflow
  # from this commit — and (b) its own CycloneDX SBOM. Complements the ed25519
  # signatures the updater verifies; this is for humans/auditors:
  #   gh attestation verify sentinelgo-linux-amd64 --repo BrainStation-23/SentinelGo
  #   gh attestation verify sentinelgo-linux-amd64 --repo BrainStation-23/SentinelGo \
  #     --predicate-type https://cyclonedx.org/bom
  attest:
    name: Attest (${{ matrix.binary }})
    runs-on: ubuntu-latest
    needs: msi
    # Explicit, so a failed macOS package job further up doesn't skip this.
    if: ${{ !cancelled() && needs.msi.result == 'success' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write     # OIDC token for the Sigstore signing certificate
      attestations: write # upload to the repository's attestations API
    strategy:
      fail-fast: true
      matrix:
        binary:
          - sentinelgo-linux-amd64
          - sentinelgo-linux-arm64
          - sentinelgo-darwin-amd64
          - sentinelgo-darwin-arm64
          - sentinelgo-windows-amd64.exe
          - sentinelgo-readonly-linux-amd64
          - sentinelgo-readonly-linux-arm64
          - sentinelgo-readonly-darwin-amd64
          - sentinelgo-readonly-darwin-arm64
          - sentinelgo-readonly-windows-amd64.exe
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ matrix.binary }}

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ matrix.binary }}
          sbom-path: artifacts/${{ matrix.binary }}.cdx.json

  # Build provenance for the installers (they have no SBOM: the MSI holds the
  # attested exe, the scripts link nothing) and for SHA256SUMS, so the
  # checksum list itself can be authenticated.
  #   gh attestation verify install.sh --repo BrainStation-23/SentinelGo
  attest-installers:
    name: Attest installers and SHA256SUMS
    runs-on: ubuntu-latest
    needs: msi
    if: ${{ !cancelled() && needs.msi.result == 'success' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write     # OIDC token for the Sigstore signing certificate
      attestations: write # upload to the repository's attestations API
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/install.sh
            artifacts/install.command
            artifacts/install.bat
            artifacts/sentinelgo-install.desktop
            artifacts/sentinelgo-windows-amd64.msi
            artifacts/sentinelgo-readonly-windows-amd64.msi
            artifacts/sentinelgo-installers.json
            artifacts/SHA256SUMS

      - name: Attest the macOS package
        if: hashFiles('artifacts/sentinelgo-darwin-universal.pkg') != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/sentinelgo-darwin-universal.pkg

      - name: Attest the read-only macOS package
        if: hashFiles('artifacts/sentinelgo-readonly-darwin-universal.pkg') != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/sentinelgo-readonly-darwin-universal.pkg

  # ── 4. Publish GitHub Release ──────────────────────────────────────────────
  # Waits for attestations so a release is never published without them.
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [sign, msi, attest, attest-installers]
    if: ${{ !cancelled() && needs.sign.result == 'success' && needs.msi.result == 'success' && needs.attest.result == 'success' && needs.attest-installers.result == 'success' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # The release body is the tag's CHANGELOG.md section, written and reviewed
      # in a pull request. Fails the release if the section is missing or empty.
      - name: Release notes from CHANGELOG.md
        run: go run ./scripts/changelog -extract "${GITHUB_REF#refs/tags/}" > release-notes.md

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          # artifacts/sentinelgo-* also covers sentinelgo-install.desktop,
          # the MSI and sentinelgo-installers.json (each with its .sig).
          files: |
