name: Changelog

# Every pull request records its user-visible change under [Unreleased] in
# CHANGELOG.md, which becomes the release notes. Changes with nothing to tell
# users (CI, tests, refactors, dependency bumps) opt out with a label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Label churn (Dependabot adds two labels as it opens a PR) supersedes the
# previous run instead of stacking up.
concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependabot PRs are exempt, so a label event on one can't change the
    # result; skip it. Every other label event still runs: a skipped required
    # check counts as passing, so skipping on, say, an unrelated label added to
    # a PR that fails this check would let it merge.
    if: >-
      !(contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) &&
        github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate CHANGELOG.md
        run: go run ./scripts/changelog -check

      # Dependency bumps are exempt by label and, independently, by author, so
      # a Dependabot PR never blocks on a missing label.
      - name: Require an entry
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
          !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Add an entry under [Unreleased] in CHANGELOG.md, or label the PR 'skip-changelog' if it has no user-visible change."
            exit 1
          fi
