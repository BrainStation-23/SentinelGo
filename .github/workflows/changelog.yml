name: Changelog

# Every pull request records its user-visible change as a fragment file in
# changelog.d/ (see changelog.d/README.md). Releasing folds the fragments into
# CHANGELOG.md, which becomes the release notes. Pull requests don't edit
# CHANGELOG.md's [Unreleased] section, so they never conflict there and merge
# in any order without a rebase. Changes with nothing to tell users (CI,
# tests, refactors, dependency bumps) opt out with a label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Label churn (Dependabot adds two labels as it opens a PR) supersedes the
# previous run instead of stacking up. Label events are never skipped: a
# skipped required check counts as passing, so a skip could hide a failure.
concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # CHANGELOG.md's format, an empty [Unreleased], and every fragment's name
      # and format.
      - name: Validate CHANGELOG.md and changelog.d
        run: go run ./scripts/changelog -check

      # Dependency bumps are exempt by label and, independently, by author, so
      # a Dependabot PR never blocks on a missing label. The release PR
      # (release/*, which folds the fragments into CHANGELOG.md) and the
      # main -> dev back-merge (head main) carry no new entry by design.
      - name: Require a fragment
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
          !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.head_ref != 'main' &&
          !startsWith(github.head_ref, 'release/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- 'changelog.d/*.md' | grep -v '^changelog.d/README.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::Add a changelog fragment: a new file changelog.d/<issue>-<words>.<type>.md (type: added, changed, deprecated, removed, fixed or security) with a '- ' entry. See changelog.d/README.md. Label the PR 'skip-changelog' if it has no user-visible change."
            exit 1
          fi
          echo "Fragments added:"
          echo "$added"
