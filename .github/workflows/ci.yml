name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call: # allows release.yml to reuse this workflow directly

permissions:
  contents: read
  pull-requests: write

env:
  GO_VERSION: '1.25.11'
  CGO_ENABLED: '0'

jobs:
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        if: matrix.goos == 'linux'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check
        if: matrix.goos == 'linux'
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted (run 'gofmt -s -w .'):"
            echo "$unformatted"
            exit 1
          fi

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
        run: go vet ./...

      - name: golangci-lint
        env:
          GOOS: ${{ matrix.goos }}
        run: golangci-lint run --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Run Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: security
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        shell: bash
        run: go test -timeout=3m -coverprofile=coverage.out -coverpkg=./... -short ./...

      - name: Show coverage summary
        shell: bash
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 1


  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    # Skip compilation check when called from release.yml — release does its
    # own build with version injection, so re-running here would be redundant.
    if: github.event_name != 'workflow_call'
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          LDFLAGS="-X sentinelgo/cmd/sentinelgo.Version=${VERSION} -X sentinelgo/internal/config.Version=${VERSION}"
          ext="${{ matrix.goos == 'windows' && '.exe' || '' }}"
          go build -ldflags "${LDFLAGS}" -o sentinelgo-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/sentinelgo

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'workflow_call'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: false

      - name: Merge coverage reports
        run: |
          awk '
            /^mode:/ { next }
            {
              key = $1 " " $2
              count = $3 + 0
              if (!(key in best) || count > best[key]) best[key] = count
            }
            END {
              print "mode: set"
              for (k in best) print k, best[k]
            }
          ' coverage-ubuntu-latest/coverage.out \
            coverage-macos-latest/coverage.out \
            coverage-windows-latest/coverage.out > coverage.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
