name: CI

# Pull requests run everything. A push to main (always the merge of a pull
# request that already passed, since both rulesets require branches to be up
# to date) only re-runs what needs a branch run of its own: the tests feeding
# SonarCloud's main-branch baseline, the security scan that keeps main's code
# scanning alerts current, and "CI passed", which release.yml looks for on the
# tagged commit. dev has no push trigger: its PRs already tested the same tree.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A new push to a pull request cancels that PR's previous run. Push runs get a
# group of their own, so they are never cancelled or queued behind each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Go comes from go.mod's toolchain line (setup-go's go-version-file reads it),
# the single place the version is set. Builds, tests and govulncheck can't
# drift apart: govulncheck once ran a newer Go than releases were built with
# and missed 28 standard-library vulnerabilities (#183).
env:
  CGO_ENABLED: '0'

jobs:
  # ── what changed ─────────────────────────────────────────────────────────────
  # A pull request that only touches the website, docs or Markdown can't affect
  # the build, so the Go jobs are skipped. "CI passed" counts a skipped job as
  # a pass, which is why it, not the individual jobs, is the required check.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      # On a pull request HEAD is the merge commit, so HEAD^1..HEAD is exactly
      # the PR's change. Anything unrecognised (or an empty diff) runs the jobs.
      - name: Filter paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if printf '%s\n' "$files" | grep -qvE '^(site|docs)/|\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, site or Markdown changed: skipping the Go jobs."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  # ── fast, platform-agnostic checks ──────────────────────────────────────────
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -s -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }

      - name: Check no CGO
        run: |
          if grep -rlE '^import "C"' --include="*.go" .; then
            echo "CGO import detected — violates CGO_ENABLED=0 policy (see CLAUDE.md)"
            exit 1
          fi

      # Every linked dependency, on every release GOOS/GOARCH, must use an
      # allow-listed permissive license (see scripts/licenses).
      - name: Dependency license check
        run: go run ./scripts/licenses -check

  # ── per-GOOS lint: catches issues in platform-specific files ─────────────────
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.12.2

  # ── security: independent — runs in parallel with lint ───────────────────────
  # Runs for every pull request, docs-only included (Trivy also scans for
  # secrets and misconfiguration), and on main so code scanning stays current.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      # Gosec: insight only — uploads findings to GitHub Security tab but does not
      # gate the build. govulncheck and Trivy are the enforcing gates below.
      - name: Run Gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          # scripts/ holds release/CI tooling that takes paths from argv by design;
          # it is never shipped in the agent binary.
          args: -exclude-dir=scripts -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true

      - name: Upload Gosec SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      # Run with the Go set up above, the version releases are built with:
      # govulncheck judges standard-library vulnerabilities by the Go that runs
      # it. (golang/govulncheck-action installs the latest Go instead, caches
      # it per PR and installs govulncheck@latest.) Pinned; Dependabot doesn't
      # see versions in a run step, so bump it by hand.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          # Pull requests reuse main's daily DB cache instead of saving a
          # ~90 MB copy per PR.
          cache: ${{ github.event_name != 'pull_request' }}

  # ── tests on real OSes ───────────────────────────────────────────────────────
  # On a pull request the tests wait for static checks and lint, so a lint
  # failure doesn't start the macOS and Windows runners. On main those jobs are
  # skipped, so this only requires that none of them failed.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, static-checks, lint]
    if: >-
      !cancelled() && needs.changes.outputs.go == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        shell: bash
        run: go test -timeout=5m -coverprofile=coverage.out -coverpkg=./... -short ./...

      # The race detector needs cgo, so only this step builds with
      # CGO_ENABLED=1; the tests above still run the way releases are built.
      # It shares this runner instead of starting its own.
      - name: Run tests with -race
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        env:
          CGO_ENABLED: '1'
        run: go test -race -timeout=10m -short ./...

      - name: Show coverage summary
        shell: bash
        run: go tool cover -func=coverage.out

      # Upload all 3 platform coverage files — the codebase has heavy platform-
      # specific implementations (every osinfo module has _linux/_darwin/_windows
      # files), so all 3 runs are needed for a meaningful merged coverage report.
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 1

  # ── cross-compile all targets ─────────────────────────────────────────────────
  # One runner type-checks every release GOOS/GOARCH with cgo off.
  build:
    name: Build (all targets)
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.changes.outputs.go == 'true' && needs.test.result == 'success'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every release target
        run: make verify-cross

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [changes, test]
    # Dependabot runs get no repository secrets, so SONAR_TOKEN is empty and the
    # scan can only fail; SonarCloud's own app still analyses those PRs.
    if: >-
      !cancelled() && needs.changes.outputs.go == 'true' &&
      needs.test.result == 'success' && github.actor != 'dependabot[bot]'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download all coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: false

      - name: Merge coverage reports
        run: |
          awk '
            /^mode:/ { next }
            {
              key = $1 " " $2
              count = ($3 + 0) > 0 ? 1 : 0
              if (!(key in best) || count > best[key]) best[key] = count
            }
            END {
              print "mode: set"
              for (k in best) print k, best[k]
            }
          ' coverage-ubuntu-latest/coverage.out \
            coverage-macos-latest/coverage.out \
            coverage-windows-latest/coverage.out > coverage.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── the required check ───────────────────────────────────────────────────────
  # The rulesets require this one job instead of each job by name, so jobs can
  # be skipped (docs-only PRs, push runs) or renamed without blocking merges.
  # It passes only if every job it depends on passed or was skipped on purpose.
  # SonarQube is left out: a SonarCloud outage shouldn't block merging.
  # release.yml checks for this job's success on the tagged commit.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [changes, static-checks, lint, security, test, build]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
