name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call: # allows release.yml to reuse this workflow directly

permissions:
  contents: read

env:
  GO_VERSION: '1.26.0'
  CGO_ENABLED: '0'

jobs:
  # ── fast, platform-agnostic checks ──────────────────────────────────────────
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -s -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }

      - name: Check no CGO
        run: |
          if grep -rlE '^import "C"' --include="*.go" .; then
            echo "CGO import detected — violates CGO_ENABLED=0 policy (see CLAUDE.md)"
            exit 1
          fi

      # Every linked dependency, on every release GOOS/GOARCH, must use an
      # allow-listed permissive license (see scripts/licenses).
      - name: Dependency license check
        run: go run ./scripts/licenses -check

  # ── per-GOOS lint: catches issues in platform-specific files ─────────────────
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.12.2

  # ── security: independent — runs in parallel with lint ───────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify modules
        run: go mod verify

      # Gosec: insight only — uploads findings to GitHub Security tab but does not
      # gate the build. govulncheck and Trivy are the enforcing gates below.
      - name: Run Gosec
        uses: securego/gosec@9e6a9843d7a4a6e3e9a8539b02612c8a4aa3f889 # v2.27.1
        with:
          # scripts/ holds release/CI tooling that takes paths from argv by design;
          # it is never shipped in the agent binary.
          args: -exclude-dir=scripts -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true

      - name: Upload Gosec SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  # ── tests on real OSes ───────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [static-checks, lint]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        shell: bash
        run: go test -timeout=5m -coverprofile=coverage.out -coverpkg=./... -short ./...

      - name: Show coverage summary
        shell: bash
        run: go tool cover -func=coverage.out

      # Upload all 3 platform coverage files — the codebase has heavy platform-
      # specific implementations (every osinfo module has _linux/_darwin/_windows
      # files), so all 3 runs are needed for a meaningful merged coverage report.
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 1

  # ── cross-compile all targets ─────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    # Skip compilation check when called from release.yml — release does its
    # own build with version injection, so re-running here would be redundant.
    if: github.event_name != 'workflow_call'
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          LDFLAGS="-X sentinelgo/cmd/sentinelgo.Version=${VERSION} -X sentinelgo/internal/config.Version=${VERSION}"
          ext="${{ matrix.goos == 'windows' && '.exe' || '' }}"
          go build -ldflags "${LDFLAGS}" -o sentinelgo-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/sentinelgo

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'workflow_call'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download all coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: false

      - name: Merge coverage reports
        run: |
          awk '
            /^mode:/ { next }
            {
              key = $1 " " $2
              count = $3 + 0
              if (!(key in best) || count > best[key]) best[key] = count
            }
            END {
              print "mode: set"
              for (k in best) print k, best[k]
            }
          ' coverage-ubuntu-latest/coverage.out \
            coverage-macos-latest/coverage.out \
            coverage-windows-latest/coverage.out > coverage.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
