name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call: # allows release.yml to reuse this workflow directly

permissions:
  contents: read

env:
  GO_VERSION: '1.25.11'
  CGO_ENABLED: '0'

jobs:
  # ── fast, platform-agnostic checks ──────────────────────────────────────────
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -s -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }

      - name: Check no CGO
        run: |
          if grep -rlE '^import "C"' --include="*.go" .; then
            echo "CGO import detected — violates CGO_ENABLED=0 policy (see CLAUDE.md)"
            exit 1
          fi

  # ── per-GOOS lint: catches issues in platform-specific files ─────────────────
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.12.2

  # ── security: independent — runs in parallel with lint ───────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify modules
        run: go mod verify

      # Gosec: insight only — uploads findings to GitHub Security tab but does not
      # gate the build. govulncheck and Trivy are the enforcing gates below.
      - name: Run Gosec
        uses: securego/gosec@v2.27.1
        with:
          args: -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true

      - name: Upload Gosec SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.1.0

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  # ── tests on real OSes ───────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [static-checks, lint]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        shell: bash
        run: go test -timeout=5m -coverprofile=coverage.out -coverpkg=./... -short ./...

      - name: Show coverage summary
        shell: bash
        run: go tool cover -func=coverage.out

      # Upload all 3 platform coverage files — the codebase has heavy platform-
      # specific implementations (every osinfo module has _linux/_darwin/_windows
      # files), so all 3 runs are needed for a meaningful merged coverage report.
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 1

  # ── cross-compile all targets ─────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    # Skip compilation check when called from release.yml — release does its
    # own build with version injection, so re-running here would be redundant.
    if: github.event_name != 'workflow_call'
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          LDFLAGS="-X sentinelgo/cmd/sentinelgo.Version=${VERSION} -X sentinelgo/internal/config.Version=${VERSION}"
          ext="${{ matrix.goos == 'windows' && '.exe' || '' }}"
          go build -ldflags "${LDFLAGS}" -o sentinelgo-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/sentinelgo

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'workflow_call'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: false

      - name: Merge coverage reports
        run: |
          awk '
            /^mode:/ { next }
            {
              key = $1 " " $2
              count = $3 + 0
              if (!(key in best) || count > best[key]) best[key] = count
            }
            END {
              print "mode: set"
              for (k in best) print k, best[k]
            }
          ' coverage-ubuntu-latest/coverage.out \
            coverage-macos-latest/coverage.out \
            coverage-windows-latest/coverage.out > coverage.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
