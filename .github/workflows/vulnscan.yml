name: Vulnerability Scan

# New vulnerabilities are published against code that hasn't changed, so this
# scans weekly even when nobody commits:
#
#   - main's source, with the Go from go.mod's toolchain line (the Go releases
#     are built with);
#   - the binaries of the latest published release, which is what installed
#     agents run. Each binary records the Go that built it, so this catches a
#     vulnerable toolchain whatever the CI setup says.
#
# Any reachable vulnerability fails the run and opens an issue (or comments on
# the open one), since a failed scheduled run alone only emails whoever last
# edited the cron line.
#
# Disclosure: this repository is public, so its logs, run summaries and issues
# are too. SECURITY.md promises coordinated disclosure, so nothing public says
# which vulnerabilities affect which release or how the agent reaches them:
# only how many were found where. The issue gives maintainers the commands to
# see the details locally. (GITHUB_TOKEN can't open a private security
# advisory, which would be the private channel.)

on:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  ISSUE_TITLE: 'Weekly vulnerability scan found reachable vulnerabilities'

jobs:
  scan:
    name: Scan main and the latest release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # download release assets
      issues: write  # report findings
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # Pinned, like the CI and release scans; bump all three together.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Download the latest release's binaries
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-bin \
            -p sentinelgo-linux-amd64 -p sentinelgo-linux-arm64 \
            -p sentinelgo-darwin-amd64 -p sentinelgo-darwin-arm64 \
            -p sentinelgo-windows-amd64.exe

      # govulncheck's report stays in a file that is never printed or
      # uploaded; only the count reaches the log and the summary.
      - name: Scan
        id: scan
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          failed=0
          : > findings.md
          scan() { # scan <label> <govulncheck args...>
            label=$1; shift
            if govulncheck "$@" > report.txt 2>&1; then
              echo "$label: no vulnerabilities found"
            else
              failed=1
              count=$(grep -c '^Vulnerability #' report.txt || true)
              echo "::warning::$label: ${count} reachable vulnerabilities (details withheld; see SECURITY.md)"
              echo "- $label: **${count}** reachable vulnerabilities" >> findings.md
            fi
            rm -f report.txt
          }
          scan "main source ($(go env GOVERSION))" ./...
          for bin in release-bin/*; do
            scan "$TAG $(basename "$bin") ($(go version "$bin" | awk '{print $NF}'))" -mode=binary "$bin"
          done
          cat findings.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Report findings in an issue
        if: steps.scan.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The [weekly vulnerability scan]($RUN_URL) found vulnerabilities that the agent's code can reach:"
            echo
            cat findings.md
            echo
            echo "Details are deliberately not published here (coordinated disclosure, see SECURITY.md). To see them, run locally:"
            echo
            echo '```sh'
            echo 'go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...'
            echo "gh release download $TAG -p 'sentinelgo-*-amd64*' -D /tmp/sg && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary /tmp/sg/sentinelgo-linux-amd64"
            echo '```'
            echo
            echo "Fix it (usually a Go toolchain or dependency bump in a PR), then release so installed agents get the fix. If a finding is exploitable in the agent, track it in a private security advisory rather than here."
          } > body.md
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" \
                  --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label bug --body-file body.md
          fi
          exit 1
