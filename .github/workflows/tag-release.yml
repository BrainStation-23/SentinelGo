name: Tag Release

# Tags main when CHANGELOG.md's newest released version has no tag yet, which
# happens when a "Release vX.Y.Z" PR (from Trigger Release, or cut by hand with
# `make changelog-release`) merges. The tag starts release.yml.
# Run it manually to retry after a failed tag push, or to re-tag main after
# deleting a tag whose release failed.
#
# After tagging it opens a main -> dev pull request, so dev gets the new
# [vX.Y.Z] heading before anything else merges from dev. Without it, the next
# dev -> main merge puts dev's new [Unreleased] entries under the released
# version (#211).
#
# The tag and the PR use RELEASE_PAT because a tag pushed or a PR opened with
# GITHUB_TOKEN doesn't trigger other workflows. See release-trigger.yml for the
# token's required permissions.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag new release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Tag the newest CHANGELOG.md version
        id: tag
        run: |
          TAG=$(go run ./scripts/changelog -latest)
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already tagged; nothing to release."
            exit 0
          fi
          # sort -V orders v1.0.0-rc.1 after v1.0.0, so a pre-release of this
          # same version doesn't count as newer.
          NEWEST=$( { git tag -l 'v[0-9]*'; echo "$TAG"; } | sort -V | tail -1)
          if [ "$NEWEST" != "$TAG" ] && [[ "$NEWEST" != "$TAG"-* ]]; then
            echo "::error file=CHANGELOG.md::Newest changelog version $TAG is older than the existing tag $NEWEST."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagged $GITHUB_SHA as $TAG; release.yml will publish it." >> "$GITHUB_STEP_SUMMARY"

      # Merge commit, not squash, so dev's history contains the release commit
      # and git stops treating main's changelog edits as new.
      - name: Merge main back into dev
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "dev already contains $TAG."
            exit 0
          fi
          PR=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base dev --head main --title "Merge $TAG back into dev" \
              --body "Brings the [$TAG] changelog heading from main into dev, so the next dev -> main merge keeps new entries under [Unreleased]. Merge it with a merge commit, not squash."
          fi
          gh pr merge main --auto --merge || echo "::warning::Could not enable auto-merge on the main -> dev PR; merge it by hand."
          echo "Back-merge PR: $(gh pr view main --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
