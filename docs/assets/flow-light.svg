<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">How SentinelGo works</title>
  <desc id="d">The SentinelGo agent on each device sends heartbeats, inventory and audit logs to your Supabase backend, which sends back tasks and signed updates and feeds dashboards and alerts.</desc>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#00876c"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#536171"/>
    </marker>
  </defs>
  <rect width="1200" height="280" rx="20" fill="#ffffff"/>
  <rect x=".5" y=".5" width="1199" height="279" rx="19.5" fill="none" stroke="#dde3ea"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Agent -->
    <rect x="40" y="70" width="260" height="140" rx="16" fill="#f6f8fa" stroke="#00876c" stroke-width="2"/>
    <path d="M170 92 150 100v13c0 12.5 8.6 22.6 20 25.3 11.4-2.7 20-12.8 20-25.3v-13z" fill="#00876c"/>
    <text x="170" y="168" font-size="23" font-weight="700" fill="#0f1720">SentinelGo agent</text>
    <text x="170" y="194" font-size="16" fill="#536171">on every device</text>

    <!-- Backend -->
    <rect x="560" y="70" width="260" height="140" rx="16" fill="#f6f8fa" stroke="#c9d1d9" stroke-width="2"/>
    <g transform="translate(690 118)" fill="none" stroke="#536171" stroke-width="3">
      <ellipse cx="0" cy="-10" rx="16" ry="6"/>
      <path d="M-16 -10v20c0 3.3 7.2 6 16 6s16-2.7 16-6V-10"/>
    </g>
    <text x="690" y="168" font-size="23" font-weight="700" fill="#0f1720">Your backend</text>
    <text x="690" y="194" font-size="16" fill="#536171">Supabase</text>

    <!-- Dashboards -->
    <rect x="920" y="70" width="240" height="140" rx="16" fill="#f6f8fa" stroke="#c9d1d9" stroke-width="2"/>
    <g transform="translate(1040 118)" fill="#536171">
      <rect x="-16" y="-4" width="7" height="16" rx="1.5"/>
      <rect x="-4" y="-12" width="7" height="24" rx="1.5"/>
      <rect x="8" y="-20" width="7" height="32" rx="1.5"/>
    </g>
    <text x="1040" y="168" font-size="23" font-weight="700" fill="#0f1720">Dashboards</text>
    <text x="1040" y="194" font-size="16" fill="#536171">and alerts</text>

    <!-- agent -> backend -->
    <path d="M310 118H548" stroke="#00876c" stroke-width="3" marker-end="url(#arrowA)"/>
    <text x="430" y="104" font-size="15" font-weight="600" fill="#00876c">heartbeat · inventory · logs</text>
    <!-- backend -> agent -->
    <path d="M550 162H312" stroke="#536171" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowM)"/>
    <text x="430" y="190" font-size="15" font-weight="600" fill="#536171">tasks · signed updates</text>
    <!-- backend -> dashboards -->
    <path d="M830 140H908" stroke="#536171" stroke-width="3" marker-end="url(#arrowM)"/>
  </g>
</svg>
